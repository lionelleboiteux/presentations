<script>
(function () {
  // ?api_dnp=<url> / ?api_compos=<url> override the defaults for local/dev
  // testing only; never persisted, so production use is unaffected. Same
  // ?api= override convention as pronos.fantasy-coach.fr's,
  // l1.dnp.fantasy-coach.fr's and l1.compos.fantasy-coach.fr's frontends,
  // split into two params here since this page combines two data sources.
  //
  // Both point at the Cloudflare Worker caches (each project's worker/),
  // never at a new backend -- this page only ever GETs, which costs
  // nothing against the shared account's Workers KV write quota (only puts
  // count). No display/fetch logic yet; these are just the bases the
  // follow-up display work will read from.
  var params = new URLSearchParams(location.search);
  var API_BASE_DNP = params.get('api_dnp') ||
    'https://dnp-l1-cache.fantasycoachfr.workers.dev';
  var API_BASE_COMPOS = params.get('api_compos') ||
    'https://compos-l1-cache.fantasycoachfr.workers.dev';
})();
</script>
